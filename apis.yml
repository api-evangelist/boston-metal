name: Boston Metal
description: >-
  Boston Metal is an industrial metals and materials company founded in 2013 and
  headquartered in Woburn, Massachusetts, with a wholly owned subsidiary and
  commercial plant in Brazil. The company commercializes Molten Oxide
  Electrolysis (MOE), a one-step electrochemical process that uses clean
  electricity rather than fossil fuels to reduce iron ore into liquid metal,
  producing steel with no direct CO2 emissions, and to recover high-value
  critical metals such as niobium and tantalum from low-grade ore and mining
  waste. Boston Metal commissioned a multi-inert-anode industrial MOE cell at
  its Woburn facility and has raised over $500 million from investors including
  Tata Steel. Boston Metal is a physical process-technology and manufacturing
  company; it publishes no public developer API, SDK, OpenAPI definition,
  developer portal, or machine-readable contract of any kind. This profile
  captures its public web, corporate, and domain-security posture only.
